<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi resultado · Liderazgo en Escena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: columna única tipo app móvil sobre fondo de cuartel (carbón con brillo rojo); identidad Bomberos por un Día, tema oscuro único */
:root{
  color-scheme:dark;
  --bg:#111113; --bg-glow:rgba(200,20,30,.30); --surface:#1c1c20; --surface-2:#25252b;
  --ink:#f4f2ee; --muted:#b4b0a8; --line:#3a3a42;
  --red:#d3192a; --red-deep:#8e0f19; --gold:#e3b23c; --gold-soft:rgba(227,178,60,.14);
  --e1:#3b82f6; --e2:#e0262f; --e3:#22b35e; --e4:#f2c418;
  --display:"Oswald", "Arial Narrow", Impact, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background:var(--bg);
  background-image:radial-gradient(120% 60% at 50% -10%, var(--bg-glow), transparent 70%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 2px, transparent 2px 14px);
  background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:14px;text-transform:uppercase;color:var(--ink)}
.brand img{width:44px;height:auto}
.brand small{display:block;font-size:11px;color:var(--gold);letter-spacing:.12em}
.count{font-family:var(--display);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.seam{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.seam span{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));width:0;transition:width .3s ease}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,9vw,46px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--body);font-weight:600;font-size:21px;line-height:1.3;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0}
.lead{color:var(--muted)}
.hero{display:flex;justify-content:center}
.hero img{width:min(78%,340px);height:auto;filter:drop-shadow(0 10px 30px rgba(211,25,42,.35))}
.stripe{height:8px;border-radius:2px;background:linear-gradient(var(--red),var(--red)) top/100% 5px no-repeat, linear-gradient(var(--gold),var(--gold)) bottom/100% 2px no-repeat}
.part{font-family:var(--display);font-size:14px;font-weight:500;color:var(--gold);letter-spacing:.1em;text-transform:uppercase}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{all:unset;box-sizing:border-box;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;font-size:16px;line-height:1.45;transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--gold)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.sel{border-color:var(--gold);background:var(--gold-soft)}
.opt b{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:6px;background:var(--red);color:#fff;font-family:var(--display);font-weight:700;font-size:15px}
.opt.sel b{background:var(--gold);color:#1a1205}
.nav{display:flex;justify-content:space-between;gap:12px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;border-radius:10px;padding:14px 22px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,var(--red),var(--red-deep));color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25), 0 0 0 1px var(--gold)}
.btn.ghost{color:var(--muted)}
.btn[disabled]{opacity:.35;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.rule{display:flex;flex-direction:column;gap:6px;padding-left:14px;border-left:3px solid var(--red)}
.rule > strong{font-family:var(--display);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.meter{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.bars .b{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bars .b span{display:block;height:100%}
.big{font-family:var(--display);font-weight:700;font-size:52px;line-height:1}
.row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
svg text{font-family:var(--display);letter-spacing:.04em}
.small{font-size:13px;color:var(--muted)}
.dl input{all:unset;box-sizing:border-box;width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px;color:var(--ink)}
.dl input:focus-visible{border-color:var(--gold)}
.dl img{width:100%;border-radius:10px;border:1px solid var(--line)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fade{animation:none}.seam span{transition:none}}
</style>

      <h2>${esc(it.q)}</h2>
      <div class="opts" role="radiogroup">
        ${opts.map(([v,t],i)=>`<button class="opt${ans[step]===v?" sel":""}" role="radio" aria-checked="${ans[step]===v}" data-v="${v}"><b>${letters[i]}</b><span>${esc(t)}</span></button>`).join("")}
      </div>
      <div class="nav">
        <button class="btn ghost" id="back">← Anterior</button>
        <button class="btn primary" id="next" ${ans[step]===null?"disabled":""}>${step===TOTAL-1?"Ver resultado":"Siguiente"}</button>
      </div>
    </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const v = isP1 ? b.dataset.v : Number(b.dataset.v);
    ans[step]=v;
    app.querySelectorAll(".opt").forEach(x=>{x.classList.toggle("sel",x===b);x.setAttribute("aria-checked",x===b)});
    document.getElementById("next").disabled=false;
    setTimeout(()=>{ if(ans[step]===v){ step++; render(); window.scrollTo(0,0);} },260);
  }));
  document.getElementById("back").onclick=()=>{ step--; render(); window.scrollTo(0,0); };
  document.getElementById("next").onclick=()=>{ if(ans[step]!==null){ step++; render(); window.scrollTo(0,0);} };
}

function cruz(r){
  // x = DIR 0..7 ; y = APO 0..7 (arriba = alto)
  const L=40,Rr=320,T=16,B=296, X=v=>L+(v+0.5)/8*(Rr-L), Y=v=>B-(v+0.5)/8*(B-T);
  const mx=(L+Rr)/2, my=(T+B)/2;
  const q=(x,y,w,h,e,lbl,tx,ty)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="var(${ESTILOS[e].c})" fill-opacity="${r.estilo===e?0.32:0.12}" stroke="var(${ESTILOS[e].c})" stroke-width="${r.estilo===e?2:1}"/><text x="${tx}" y="${ty}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${lbl.toUpperCase()}</text>`;
  const w=(Rr-L)/2-4, h=(B-T)/2-4;
  return `<svg viewBox="0 0 340 336" width="100%" role="img" aria-label="Tu ubicación en la cruz dirección y apoyo">
    ${q(L,T,w,h,3,"Apoyar",L+w/2,T+22)}
    ${q(mx+4,T,w,h,2,"Entrenar",mx+4+w/2,T+22)}
    ${q(L,my+4,w,h,4,"Delegar",L+w/2,B-12)}
    ${q(mx+4,my+4,w,h,1,"Dirigir",mx+4+w/2,B-12)}
    <circle cx="${X(r.DIR)}" cy="${Y(r.APO)}" r="10" fill="#fff" stroke="#111113" stroke-width="3"/><circle cx="${X(r.DIR)}" cy="${Y(r.APO)}" r="4" fill="var(--red)"/>
    <text x="${(L+Rr)/2}" y="324" text-anchor="middle" font-size="12" fill="var(--muted)">Dirección → (DIR ${r.DIR} de 7)</text>
    <text x="14" y="${my}" text-anchor="middle" font-size="12" fill="var(--muted)" transform="rotate(-90 14 ${my})">Apoyo → (APO ${r.APO} de 7)</text>
  </svg>`;
}

      <div class="rule"><strong>Para crecer</strong><p>${E.g}</p></div>

const C_HEX={1:"#3b82f6",2:"#e0262f",3:"#22b35e",4:"#f2c418"};
let logoImg=null;
function cargarLogo(){ if(logoImg) return Promise.resolve(logoImg);
  return new Promise(res=>{const im=new Image(); im.onload=()=>{logoImg=im;res(im)}; im.onerror=()=>res(null); im.src=LOGO;}); }
function wrap(ctx,text,maxW){ const words=text.split(" "),lines=[]; let line="";
  for(const w of words){ const t=line?line+" "+w:w; if(ctx.measureText(t).width>maxW && line){lines.push(line);line=w;} else line=t; }
  if(line) lines.push(line); return lines; }
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
async function dibujar(r,nombre){
  try{ await Promise.all([document.fonts.load('700 60px Oswald'),document.fonts.load('500 30px Oswald'),document.fonts.load('400 28px Figtree'),document.fonts.load('600 28px Figtree')]); }catch(e){}
  const W=1080,H=1350,cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x=cv.getContext("2d");
  const D='Oswald, "Arial Narrow", Impact, sans-serif', B='Figtree, "Segoe UI", Arial, sans-serif', E=ESTILOS[r.estilo];

  x.fillStyle="#d3192a"; x.fillRect(0,0,W,14); x.fillRect(0,H-14,W,14); x.fillStyle="#e3b23c"; x.fillRect(0,17,W,5); x.fillRect(0,H-22,W,5);

  const quad=[[3,cx0,cy0,"APOYAR"],[2,cx0+q+gap,cy0,"ENTRENAR"],[4,cx0,cy0+q+gap,"DELEGAR"],[1,cx0+q+gap,cy0+q+gap,"DIRIGIR"]];

  x.fillStyle="#b4b0a8"; x.font=`500 18px ${D}`; x.fillText(`DIRECCIÓN ${r.DIR}/7  ·  APOYO ${r.APO}/7`,cx0+cs/2,cy0+cs+30);

  x.fillStyle="#e3b23c"; x.font=`600 24px ${B}`; x.fillText(r.nivel,rx+nw+14,py+138);
  x.fillStyle="#25252b"; rrect(x,rx,py+156,rw,14,7); x.fill();

  x.fillStyle="#b4b0a8"; x.font=`500 20px ${D}`; x.fillText("ESTILOS QUE ELEGÍ EN LAS SITUACIONES",rx,py+214);
  [1,2,3,4].forEach((e,i)=>{ const by=py+232+i*34; x.fillStyle="#f4f2ee"; x.font=`500 21px ${B}`; x.textAlign="left"; x.fillText(ESTILOS[e].n,rx,by+17);

async function descargar(r){
  const btn=document.getElementById("descargar"), msg=document.getElementById("dlmsg"), img=document.getElementById("dlimg");
  const nombre=document.getElementById("nombre").value.trim();
  btn.disabled=true; msg.textContent="Preparando tu imagen…";
  let blob; try{ blob=await dibujar(r,nombre); }catch(e){ blob=null; }
  btn.disabled=false;
  if(!blob){ msg.textContent="No se pudo crear la imagen. Intenta de nuevo."; return; }
  const slug=(nombre||"mi-resultado").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"mi-resultado";
  const mostrar=t=>{ img.src=URL.createObjectURL(blob); img.hidden=false; msg.textContent=t; };
  const dl = null;
  if(!dl){ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=`liderazgo-en-escena-${slug}.png`; document.body.appendChild(a); a.click(); a.remove(); mostrar("Si no se descargó, mantén presionada la imagen para guardarla."); return; }
  try{ await dl.save({filename:`liderazgo-en-escena-${slug}.png`,data:blob}); msg.textContent="Listo, tu resultado quedó guardado."; }
  catch(e){ if(e&&e.code==="declined"){ msg.textContent="Descarga cancelada."; }
    else if(e&&e.code==="rate_limited"){ msg.textContent="Espera un momento y vuelve a intentarlo."; }
    else mostrar("Mantén presionada la imagen para guardarla en tu teléfono."); }
